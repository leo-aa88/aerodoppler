# Dependabot version updates. Security updates are enabled separately in the repository's
# Settings → Code security ("Dependabot security updates").
version: 2
updates:
  # Python dependencies (pyproject.toml + uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    commit-message:
      prefix: "deps(python)"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]

  # Web frontend (web/package.json + package-lock.json)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "javascript"]
    commit-message:
      prefix: "deps(web)"
    groups:
      web-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # TypeScript 7 (native compiler) drops the JS API Next.js 15 uses to read tsconfig.json,
      # so the "@/..." path aliases stop resolving and the build fails. Revisit with Next.js.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Node type definitions should follow the Node major the UI is built with; bump deliberately.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used in .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "deps(ci)"
    groups:
      actions:
        patterns: ["*"]

  # Base images in the Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "deps(docker)"
    ignore:
      # Stay on the Python minor the project is tested on (requires-python >= 3.12, CI uses 3.12).
      # Newer minors lack prebuilt wheels for compiled deps (orjson, numba, ...) and fail to build
      # in the slim image. Move deliberately, together with CI.
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
