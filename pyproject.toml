[project]
name = "aerodoppler"
version = "0.1.0"
description = "Consent-based research tool: aircraft-Doppler acoustic geolocation of stationary recordings using historical ADS-B trajectories."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.13",
  "soundfile>=0.12",
  "polars>=1.0",
  "pyarrow>=16",
  "duckdb>=1.0",
  "numba>=0.60",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyproj>=3.6",
  "rasterio>=1.3.10",
  "shapely>=2.0",
  "scikit-learn>=1.5",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "typer>=0.12",
  "orjson>=3.10",
  "httpx>=0.27",
  "matplotlib>=3.9",
  "imageio-ffmpeg>=0.5",
  "python-multipart>=0.0.9",
  "tqdm>=4.66",
  "psutil>=5.9",
  "sse-starlette>=2.1",
]

[project.scripts]
aerodoppler = "aerodoppler.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-timeout>=2.3",
  "ruff>=0.5",
  "mypy>=1.10",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aerodoppler"]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-timeout>=2.3",
  "ruff>=0.5",
  "mypy>=1.10",
  "playwright>=1.64.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
ignore = ["E501", "B008", "B905", "NPY002"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 900
markers = [
  "network: requires internet access (skipped in offline mode)",
  "slow: long-running test",
  "ffmpeg: requires an ffmpeg binary",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
